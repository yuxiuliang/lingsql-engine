spring:
  application:
    name: lingsql-engine

  # 1. 开启 Java 21 虚拟线程（高并发核心）
  threads:
    virtual:
      enabled: true
  # 2. 管理库配置 (存放租户连接信息的表)
  datasource:
    url: jdbc:mysql://localhost:3306/lingsql_engine_db?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${LINGSQL_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      connection-timeout: 30000

  # 3. JPA 配置
  jpa:
    hibernate:
      ddl-auto: update # 自动建表/更新表结构
    show-sql: true
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  # 4. Redis 缓存配置 (元数据记忆)
  data:
    redis:
      host: localhost
      port: 6379
      password: ${LINGSQL_REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 20

# 6. 项目自定义日志配置
logging:
  level:
    com.lingsql: debug
    org.springframework.ai: info
    org.hibernate.orm.connections.pooling: warn
server:
  port: 8000

lingsql:
  security:
    default-limit: 100
    data-encryption-enabled: ${LINGSQL_DATA_ENCRYPTION_ENABLED:true}
    data-encryption-key: ${LINGSQL_DATA_ENCRYPTION_KEY:d033e22ae348aeb5660fc2122ae348aeb56640aec35850c4da997}
    data-encryption-migrate: ${LINGSQL_DATA_ENCRYPTION_MIGRATE:true}
    prompt-injection-keywords:
      - "忽略规则"
      - "绕过"
      - "system prompt"
      - "prompt injection"
      - "无视限制"
    rate-limit:
      sensitive-enabled: ${LINGSQL_SECURITY_RATE_SENSITIVE_ENABLED:true}
      sensitive-max-requests: ${LINGSQL_SECURITY_RATE_SENSITIVE_MAX_REQUESTS:60}
      sensitive-window: ${LINGSQL_SECURITY_RATE_SENSITIVE_WINDOW:1m}
      sensitive-block: ${LINGSQL_SECURITY_RATE_SENSITIVE_BLOCK:5m}
      trust-proxy-headers: ${LINGSQL_SECURITY_RATE_TRUST_PROXY_HEADERS:false}
      trusted-proxy-ips: ${LINGSQL_SECURITY_RATE_TRUSTED_PROXY_IPS:}
  cache:
    schema-ttl: 24h
    comment-ttl: 168h
    semantic-ttl: 6h
    chat-history-ttl: 30m
  billing:
    ledger-batch-size: 200
    ledger-settle-interval-ms: 5000
    charged-key-ttl: 72h
    reconcile-window: 24h
    reconcile-interval-ms: 60000
    reconcile-batch-size: 200
    reconcile-diff-threshold: 0
  web:
    max-page-size: 100
    export-max-rows: 10000
  audit:
    retry-enabled: true
    retry-max-queue: 1000
    retry-batch-size: 100
    retry-max-attempts: 3
    retry-delay-ms: 60000
  chat:
    max-question-length: 4000
  ai:
    memory:
      limit: 10
      ttl: 30m
  hikari:
    maximum-pool-size: 20
    minimum-idle: 5
    idle-timeout: 10m
    connection-timeout: 30s
    tenant-cache-ttl: 30m
    max-tenant-pools: 200
    tenant-cache-clean-interval-ms: 300000
  model:
    cooldown: 10m
  cors:
    enabled: true
    allowed-origins:
      - "http://localhost:4173"
      - "http://127.0.0.1:4173"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed-headers:
      - "Authorization"
      - "Content-Type"
      - "X-Tenant-Id"
      - "X-Request-Id"
      - "X-Trace-Id"
      - "X-Refresh-Token"
    exposed-headers:
      - "X-Request-Id"
      - "X-Trace-Id"
    allow-credentials: true
    max-age: 3600
  auth:
    jwt-secret: ${LINGSQL_JWT_SECRET:}
    jwt-issuer: "lingsql-engine"
    jwt-ttl: 24h
    refresh-cookie-enabled: ${LINGSQL_REFRESH_COOKIE_ENABLED:true}
    refresh-cookie-name: ${LINGSQL_REFRESH_COOKIE_NAME:lingsql_refresh_token}
    refresh-cookie-path: ${LINGSQL_REFRESH_COOKIE_PATH:/api/v1/auth}
    refresh-cookie-same-site: ${LINGSQL_REFRESH_COOKIE_SAME_SITE:Lax}
    refresh-cookie-secure: ${LINGSQL_REFRESH_COOKIE_SECURE:false}
    single-session-enabled: ${LINGSQL_AUTH_SINGLE_SESSION_ENABLED:true}
  admin:
    enabled: ${LINGSQL_ADMIN_ENABLED:true}
    tenant-id: ${LINGSQL_ADMIN_TENANT_ID:1}
    tenant-name: ${LINGSQL_ADMIN_TENANT_NAME:1}
    username: ${LINGSQL_ADMIN_USERNAME:admin}
    password: ${LINGSQL_ADMIN_PASSWORD:}
    nickname: ${LINGSQL_ADMIN_NICKNAME:测试}
    seed-resource: ${LINGSQL_ADMIN_SEED_RESOURCE:classpath:rbac-seed.json}
