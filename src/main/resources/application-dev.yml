
spring:
  application:
    name: lingsql-engine

  # 1. 开启 Java 21 虚拟线程（高并发核心）
  threads:
    virtual:
      enabled: true
  # 2. 管理库配置 (存放租户连接信息的表)
  datasource:
    url: jdbc:mysql://localhost:3306/lingsql_engine_db?useSSL=false&serverTimezone=UTC
    username: root
    password: 12345678
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      connection-timeout: 30000

  # 3. JPA 配置
  jpa:
    hibernate:
      ddl-auto: update # 自动建表/更新表结构
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # 4. Redis 缓存配置 (元数据记忆)
  data:
    redis:
      host: localhost
      port: 6379
      password: 12345678
      lettuce:
        pool:
          max-active: 20

# 6. 项目自定义日志配置
logging:
  level:
    com.lingsql: debug
    org.springframework.ai: info
    org.hibernate.orm.connections.pooling: warn
server:
  port: 8000
