spring:
  profiles:
    active: dev

lingsql:
  security:
    default-limit: 100
    prompt-injection-keywords:
      - "忽略规则"
      - "绕过"
      - "system prompt"
      - "prompt injection"
      - "无视限制"
  cache:
    schema-ttl: 24h
    comment-ttl: 168h
    semantic-ttl: 6h
  hikari:
    maximum-pool-size: 20
    minimum-idle: 5
    idle-timeout: 10m
    connection-timeout: 30s
  model:
    cooldown: 10m
