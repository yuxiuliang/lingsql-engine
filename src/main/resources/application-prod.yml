spring:
  application:
    name: lingsql-engine
  datasource:
    url: ${LINGSQL_DB_URL:}
    username: ${LINGSQL_DB_USERNAME:}
    password: ${LINGSQL_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  data:
    redis:
      host: ${LINGSQL_REDIS_HOST:localhost}
      port: ${LINGSQL_REDIS_PORT:6379}
      password: ${LINGSQL_REDIS_PASSWORD:}

logging:
  level:
    com.lingsql: info
    org.springframework.ai: info
    org.hibernate.orm.connections.pooling: warn

server:
  port: ${SERVER_PORT:8000}

lingsql:
  security:
    default-limit: 100
    data-encryption-enabled: ${LINGSQL_DATA_ENCRYPTION_ENABLED:true}
    data-encryption-key: ${LINGSQL_DATA_ENCRYPTION_KEY:}
    data-encryption-migrate: ${LINGSQL_DATA_ENCRYPTION_MIGRATE:false}
    prompt-injection-keywords:
      - "忽略规则"
      - "绕过"
      - "system prompt"
      - "prompt injection"
      - "无视限制"
    rate-limit:
      sensitive-enabled: ${LINGSQL_SECURITY_RATE_SENSITIVE_ENABLED:true}
      sensitive-max-requests: ${LINGSQL_SECURITY_RATE_SENSITIVE_MAX_REQUESTS:60}
      sensitive-window: ${LINGSQL_SECURITY_RATE_SENSITIVE_WINDOW:1m}
      sensitive-block: ${LINGSQL_SECURITY_RATE_SENSITIVE_BLOCK:5m}
      trust-proxy-headers: ${LINGSQL_SECURITY_RATE_TRUST_PROXY_HEADERS:false}
      trusted-proxy-ips: ${LINGSQL_SECURITY_RATE_TRUSTED_PROXY_IPS:}
  cache:
    schema-ttl: 24h
    comment-ttl: 168h
    semantic-ttl: 6h
    chat-history-ttl: 30m
  billing:
    ledger-batch-size: 200
    ledger-settle-interval-ms: 5000
    charged-key-ttl: 72h
    reconcile-window: 24h
    reconcile-interval-ms: 60000
    reconcile-batch-size: 200
    reconcile-diff-threshold: 0
  web:
    max-page-size: ${LINGSQL_WEB_MAX_PAGE_SIZE:100}
    export-max-rows: ${LINGSQL_WEB_EXPORT_MAX_ROWS:10000}
  audit:
    retry-enabled: ${LINGSQL_AUDIT_RETRY_ENABLED:true}
    retry-max-queue: ${LINGSQL_AUDIT_RETRY_MAX_QUEUE:1000}
    retry-batch-size: ${LINGSQL_AUDIT_RETRY_BATCH_SIZE:100}
    retry-max-attempts: ${LINGSQL_AUDIT_RETRY_MAX_ATTEMPTS:3}
    retry-delay-ms: ${LINGSQL_AUDIT_RETRY_DELAY_MS:60000}
  chat:
    max-question-length: 4000
  ai:
    memory:
      limit: 10
      ttl: 30m
  hikari:
    maximum-pool-size: 20
    minimum-idle: 5
    idle-timeout: 10m
    connection-timeout: 30s
    tenant-cache-ttl: ${LINGSQL_TENANT_CACHE_TTL:30m}
    max-tenant-pools: ${LINGSQL_MAX_TENANT_POOLS:200}
    tenant-cache-clean-interval-ms: ${LINGSQL_TENANT_CACHE_CLEAN_INTERVAL_MS:300000}
  model:
    cooldown: 10m
  cors:
    enabled: ${LINGSQL_CORS_ENABLED:false}
    allowed-origins: ${LINGSQL_CORS_ALLOWED_ORIGINS:}
    allowed-methods: ${LINGSQL_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    allowed-headers: ${LINGSQL_CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Tenant-Id,X-Request-Id,X-Trace-Id,X-Refresh-Token}
    exposed-headers: ${LINGSQL_CORS_EXPOSED_HEADERS:X-Request-Id,X-Trace-Id}
    allow-credentials: ${LINGSQL_CORS_ALLOW_CREDENTIALS:true}
    max-age: ${LINGSQL_CORS_MAX_AGE:3600}
  auth:
    jwt-secret: ${LINGSQL_JWT_SECRET:}
    jwt-issuer: ${LINGSQL_JWT_ISSUER:lingsql-engine}
    jwt-ttl: ${LINGSQL_JWT_TTL:24h}
    refresh-cookie-enabled: ${LINGSQL_REFRESH_COOKIE_ENABLED:true}
    refresh-cookie-name: ${LINGSQL_REFRESH_COOKIE_NAME:lingsql_refresh_token}
    refresh-cookie-path: ${LINGSQL_REFRESH_COOKIE_PATH:/api/v1/auth}
    refresh-cookie-same-site: ${LINGSQL_REFRESH_COOKIE_SAME_SITE:Lax}
    refresh-cookie-secure: ${LINGSQL_REFRESH_COOKIE_SECURE:false}
  admin:
    enabled: ${LINGSQL_ADMIN_ENABLED:false}
    tenant-id: ${LINGSQL_ADMIN_TENANT_ID:}
    tenant-name: ${LINGSQL_ADMIN_TENANT_NAME:}
    username: ${LINGSQL_ADMIN_USERNAME:}
    password: ${LINGSQL_ADMIN_PASSWORD:}
    nickname: ${LINGSQL_ADMIN_NICKNAME:}
    seed-resource: ${LINGSQL_ADMIN_SEED_RESOURCE:classpath:rbac-seed.json}
