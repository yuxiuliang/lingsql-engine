name: LingSQL Release Deploy

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: "部署环境名称（如 production / uat）"
        required: true
        default: "production"
        type: string
      base_url:
        description: "目标环境基础地址（如 https://api.lingsql.com）"
        required: true
        type: string
      prometheus_url:
        description: "Prometheus 地址（用于发布门禁）"
        required: true
        type: string
      release_tag:
        description: "发布版本标签（如 v2026.02.28.1）"
        required: true
        type: string
      billing_readiness_url:
        description: "计费验收接口地址（留空则基于 base_url 自动拼接）"
        required: false
        default: ""
        type: string
      p1_drill_id:
        description: "本次引用的真实 P1 演练编号"
        required: true
        type: string
      p1_detected_at:
        description: "P1 演练发现时间（ISO-8601）"
        required: true
        type: string
      p1_acked_at:
        description: "P1 演练响应确认时间（ISO-8601）"
        required: true
        type: string
      p1_mitigated_at:
        description: "P1 演练缓解完成时间（ISO-8601）"
        required: true
        type: string

jobs:
  build-artifact:
    name: Build Artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Release Source
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "::error::正式发布只能从远端 master 执行，当前引用为 ${GITHUB_REF}。"
            exit 1
          fi

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web_src/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web_src
        run: npm ci

      - name: Audit Frontend Dependencies
        working-directory: web_src
        run: ../scripts/ops/npm_audit_with_fallback.sh

      - name: Build Admin UI Into Backend Resources
        working-directory: web_src
        run: npm run build

      - name: Schema Drift Guard
        run: bash scripts/ops/schema_drift_guard.sh

      - name: Build And Test Backend Package
        run: mvn -B -ntp clean package -DskipITs

      - name: Verify Admin UI In Release Package
        run: |
          ARTIFACT_FILE="$(ls -1 target/lingsql-engine-*.jar | grep -v '\.original$' | head -n 1)"
          test -n "${ARTIFACT_FILE}"
          jar tf "${ARTIFACT_FILE}" | grep -q 'BOOT-INF/classes/static/admin/index.html'

      - name: Prepare Artifact
        run: |
          mkdir -p dist
          ARTIFACT_FILE="$(ls -1 target/lingsql-engine-*.jar | grep -v '\.original$' | head -n 1)"
          test -n "${ARTIFACT_FILE}"
          cp "${ARTIFACT_FILE}" dist/lingsql-engine.jar

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: lingsql-release-jar
          path: dist/lingsql-engine.jar

  deploy:
    name: Deploy With Auto Rollback
    needs: build-artifact
    runs-on: self-hosted
    environment: ${{ inputs.environment_name }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: lingsql-release-jar
          path: dist

      - name: Prepare Scripts
        run: chmod +x scripts/ops/*.sh

      - name: Validate Strict Gate Inputs
        env:
          BASE_URL: ${{ inputs.base_url }}
          PROMETHEUS_URL: ${{ inputs.prometheus_url }}
          BILLING_READINESS_URL: ${{ inputs.billing_readiness_url }}
          DRILL_ID: ${{ inputs.p1_drill_id }}
          DETECTED_AT: ${{ inputs.p1_detected_at }}
          ACKED_AT: ${{ inputs.p1_acked_at }}
          MITIGATED_AT: ${{ inputs.p1_mitigated_at }}
          LINGSQL_MIGRATION_HOOK: ${{ vars.LINGSQL_MIGRATION_HOOK }}
          BACKUP_RESTORE_MYSQL_HOST: ${{ vars.RELEASE_GATE_MYSQL_HOST }}
          BACKUP_RESTORE_MYSQL_PORT: ${{ vars.RELEASE_GATE_MYSQL_PORT }}
          BACKUP_RESTORE_SOURCE_DB: ${{ vars.RELEASE_GATE_BACKUP_SOURCE_DB }}
          BACKUP_RESTORE_BACKUP_DIR: ${{ vars.RELEASE_GATE_BACKUP_DIR }}
          BACKUP_RESTORE_BACKUP_USER: ${{ vars.RELEASE_GATE_BACKUP_USER }}
          BACKUP_RESTORE_RESTORE_USER: ${{ vars.RELEASE_GATE_RESTORE_USER }}
        run: |
          BASE_URL_TRIMMED="$(printf '%s' "${BASE_URL}" | xargs)"
          BILLING_URL_TRIMMED="$(printf '%s' "${BILLING_READINESS_URL}" | xargs)"
          if [ -z "${BILLING_URL_TRIMMED}" ] && [ -z "${BASE_URL_TRIMMED}" ]; then
            echo "::error::billing_readiness_url 与 base_url 不能同时为空。"
            exit 1
          fi
          for name in PROMETHEUS_URL DRILL_ID DETECTED_AT ACKED_AT MITIGATED_AT LINGSQL_MIGRATION_HOOK \
            BACKUP_RESTORE_MYSQL_HOST BACKUP_RESTORE_MYSQL_PORT BACKUP_RESTORE_SOURCE_DB \
            BACKUP_RESTORE_BACKUP_DIR BACKUP_RESTORE_BACKUP_USER BACKUP_RESTORE_RESTORE_USER; do
            if [ -z "$(printf '%s' "${!name}" | xargs)" ]; then
              echo "::error::严格发布门禁缺少 ${name}。"
              exit 1
            fi
          done

      - name: Validate Gate Credentials
        env:
          RELEASE_GATE_BILLING_TOKEN: ${{ secrets.RELEASE_GATE_BILLING_TOKEN }}
          RELEASE_GATE_CONTROL_TOKEN: ${{ secrets.RELEASE_GATE_CONTROL_TOKEN }}
          PILOT_TENANT_ID: ${{ secrets.RELEASE_GATE_PILOT_TENANT_ID }}
          PILOT_USERNAME: ${{ secrets.RELEASE_GATE_PILOT_USERNAME }}
          PILOT_PASSWORD: ${{ secrets.RELEASE_GATE_PILOT_PASSWORD }}
          BACKUP_RESTORE_BACKUP_PASSWORD: ${{ secrets.RELEASE_GATE_BACKUP_PASSWORD }}
          BACKUP_RESTORE_RESTORE_PASSWORD: ${{ secrets.RELEASE_GATE_RESTORE_PASSWORD }}
          BACKUP_RESTORE_SAMPLE_QUERY: ${{ secrets.RELEASE_GATE_BACKUP_SAMPLE_QUERY }}
        run: |
          for name in RELEASE_GATE_BILLING_TOKEN RELEASE_GATE_CONTROL_TOKEN PILOT_TENANT_ID PILOT_USERNAME PILOT_PASSWORD \
            BACKUP_RESTORE_BACKUP_PASSWORD BACKUP_RESTORE_RESTORE_PASSWORD BACKUP_RESTORE_SAMPLE_QUERY; do
            if [ -z "${!name}" ]; then
              echo "::error::严格发布门禁缺少 secret ${name}。"
              exit 1
            fi
          done

      - name: Pre Release Gate
        env:
          BASE_URL: ${{ inputs.base_url }}
          PROMETHEUS_URL: ${{ inputs.prometheus_url }}
          RELEASE_GATE_ENABLE_SMOKE: "true"
          RELEASE_GATE_ENABLE_SLO: "true"
          RELEASE_GATE_ENABLE_COMMERCIAL: "true"
          RELEASE_GATE_BLOCK_ON_SLO_BREACH: "true"
          RELEASE_GATE_SLO_REPORT_FILE: ./reports/release_gate_slo.md
          RELEASE_GATE_COMMERCIAL_REPORT_FILE: ./reports/commercial_acceptance.md
          BILLING_READINESS_URL: ${{ inputs.billing_readiness_url }}
          BILLING_ALLOW_SKIP: "false"
          BILLING_AUTH_TOKEN: ${{ secrets.RELEASE_GATE_BILLING_TOKEN }}
          COMMERCIAL_REQUIRE_SLO: "true"
          COMMERCIAL_REQUIRE_PILOT: "true"
          SLO_WINDOW: "30d"
          SLO_TARGET: "99.9"
          SLO_MIN_REQUESTS: "100"
          PILOT_TENANT_ID: ${{ secrets.RELEASE_GATE_PILOT_TENANT_ID }}
          PILOT_USERNAME: ${{ secrets.RELEASE_GATE_PILOT_USERNAME }}
          PILOT_PASSWORD: ${{ secrets.RELEASE_GATE_PILOT_PASSWORD }}
          PILOT_CONTROL_TOKEN: ${{ secrets.RELEASE_GATE_CONTROL_TOKEN }}
          PILOT_REPORT_FILE: ./reports/pilot_acceptance.md
          BACKUP_RESTORE_MYSQL_HOST: ${{ vars.RELEASE_GATE_MYSQL_HOST }}
          BACKUP_RESTORE_MYSQL_PORT: ${{ vars.RELEASE_GATE_MYSQL_PORT }}
          BACKUP_RESTORE_SOURCE_DB: ${{ vars.RELEASE_GATE_BACKUP_SOURCE_DB }}
          BACKUP_RESTORE_TARGET_DB: lingsql_restore_verify_${{ github.run_id }}_${{ github.run_attempt }}
          BACKUP_RESTORE_BACKUP_USER: ${{ vars.RELEASE_GATE_BACKUP_USER }}
          BACKUP_RESTORE_BACKUP_PASSWORD: ${{ secrets.RELEASE_GATE_BACKUP_PASSWORD }}
          BACKUP_RESTORE_RESTORE_USER: ${{ vars.RELEASE_GATE_RESTORE_USER }}
          BACKUP_RESTORE_RESTORE_PASSWORD: ${{ secrets.RELEASE_GATE_RESTORE_PASSWORD }}
          BACKUP_RESTORE_BACKUP_DIR: ${{ vars.RELEASE_GATE_BACKUP_DIR }}
          BACKUP_RESTORE_WORK_ROOT: ${{ runner.temp }}/lingsql-backup-restore
          BACKUP_RESTORE_SAMPLE_QUERY: ${{ secrets.RELEASE_GATE_BACKUP_SAMPLE_QUERY }}
          BACKUP_RESTORE_REPORT_FILE: ./reports/backup_restore_acceptance.md
          DRILL_ID: ${{ inputs.p1_drill_id }}
          DETECTED_AT: ${{ inputs.p1_detected_at }}
          ACKED_AT: ${{ inputs.p1_acked_at }}
          MITIGATED_AT: ${{ inputs.p1_mitigated_at }}
        run: ./scripts/ops/release_gate.sh

      - name: Run Required Database Migration Hook
        env:
          LINGSQL_MIGRATION_HOOK: ${{ vars.LINGSQL_MIGRATION_HOOK }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ ! -x "${LINGSQL_MIGRATION_HOOK}" ]; then
            echo "::error::数据库迁移 Hook 不存在或不可执行: ${LINGSQL_MIGRATION_HOOK}"
            exit 1
          fi
          "${LINGSQL_MIGRATION_HOOK}" "${GITHUB_SHA}" "${RELEASE_TAG}"

      - name: Deploy And Auto Rollback
        env:
          BASE_URL: ${{ inputs.base_url }}
          RELEASE_POST_SMOKE_ENABLED: "true"
          RELEASE_AUTO_ROLLBACK_ON_SMOKE_FAIL: "true"
          RELEASE_NOTIFY_ENABLED: "true"
          RELEASE_NOTIFY_SCRIPT: ./scripts/ops/notify_release_event.sh
          RELEASE_NOTIFY_WEBHOOK_URL: ${{ secrets.RELEASE_NOTIFY_WEBHOOK_URL }}
          RELEASE_NOTIFY_DINGTALK_WEBHOOK_URL: ${{ secrets.RELEASE_NOTIFY_DINGTALK_WEBHOOK_URL }}
          RELEASE_NOTIFY_WECOM_WEBHOOK_URL: ${{ secrets.RELEASE_NOTIFY_WECOM_WEBHOOK_URL }}
          RELEASE_NOTIFY_REQUIRE_ALL_CHANNELS: "false"
          LINGSQL_DEPLOY_BASE: ${{ vars.LINGSQL_DEPLOY_BASE }}
          LINGSQL_SWITCH_HOOK: ${{ vars.LINGSQL_SWITCH_HOOK }}
        run: ./scripts/ops/release_with_auto_rollback.sh ./dist/lingsql-engine.jar "${{ inputs.release_tag }}"

      - name: Upload Gate Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-deploy-gate-reports
          path: reports/
          if-no-files-found: ignore
