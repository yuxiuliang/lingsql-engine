name: LingSQL CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: lingsql-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Schema Drift Guard
        run: bash scripts/ops/schema_drift_guard.sh

      - name: Run Maven Tests
        run: mvn -B -ntp test -DskipITs

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web_src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm ci

      - name: Prepare Security Scripts
        run: chmod +x ../scripts/ops/*.sh

      - name: Audit Dependencies (High/Critical)
        run: ../scripts/ops/npm_audit_with_fallback.sh

      - name: Build Admin UI
        run: npm run build
