name: LingSQL CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: lingsql-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Schema Drift Guard
        run: bash scripts/ops/schema_drift_guard.sh

      - name: Security Compliance Guard
        run: bash scripts/ops/security_compliance_guard.sh

      - name: Validate Operations Script Syntax
        run: bash -n scripts/ops/*.sh

      - name: Run Maven Tests
        run: mvn -B -ntp test -DskipITs

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web_src
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm ci

      - name: Prepare Security Scripts
        run: chmod +x ../scripts/ops/*.sh

      - name: Audit Dependencies (High/Critical)
        run: ../scripts/ops/npm_audit_with_fallback.sh

      - name: Build Admin UI
        run: npm run build

  container-build:
    name: Container Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose Configuration
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_APP_PASSWORD: ci-app-password
          REDIS_PASSWORD: ci-redis-password
          LINGSQL_JWT_SECRET: ci-jwt-secret-at-least-32-characters
          LINGSQL_DATA_ENCRYPTION_KEY: ci-data-encryption-key-at-least-48-characters-long
          LINGSQL_ADMIN_PASSWORD: ci-admin-password
        run: docker compose config --quiet

      - name: Build Production Image
        run: docker build --tag lingsql-engine:ci .

      - name: Verify Non Root Runtime User
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' lingsql-engine:ci)" = "10001:10001"
