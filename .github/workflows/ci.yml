name: LingSQL CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: lingsql-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Schema Drift Guard
        run: bash scripts/ops/schema_drift_guard.sh

      - name: Security Compliance Guard
        run: bash scripts/ops/security_compliance_guard.sh

      - name: Validate Operations Script Syntax
        run: bash -n scripts/ops/*.sh

      - name: Run Maven Tests
        run: mvn -B -ntp test -DskipITs

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web_src
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm ci

      - name: Prepare Security Scripts
        run: chmod +x ../scripts/ops/*.sh

      - name: Audit Dependencies (High/Critical)
        run: ../scripts/ops/npm_audit_with_fallback.sh

      - name: Build Admin UI
        run: npm run build

  container-build:
    name: Container Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose Configuration
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_APP_PASSWORD: ci-app-password
          REDIS_PASSWORD: ci-redis-password
          LINGSQL_JWT_SECRET: ci-jwt-secret-at-least-32-characters
          LINGSQL_DATA_ENCRYPTION_KEY: ci-data-encryption-key-at-least-48-characters-long
          LINGSQL_ADMIN_PASSWORD: ci-admin-password
        run: docker compose config --quiet

      - name: Validate Integration Compose Configuration
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_APP_PASSWORD: ci-app-password
          REDIS_PASSWORD: ci-redis-password
          LINGSQL_JWT_SECRET: ci-jwt-secret-at-least-32-characters
          LINGSQL_DATA_ENCRYPTION_KEY: ci-data-encryption-key-at-least-48-characters-long
          LINGSQL_ADMIN_PASSWORD: ci-admin-password
        run: docker compose -f docker-compose.yml -f docker-compose.integration.yml config --quiet

      - name: Build Production Image
        run: docker build --tag lingsql-engine:ci .

      - name: Verify Non Root Runtime User
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' lingsql-engine:ci)" = "10001:10001"

  supply-chain:
    name: Supply Chain Evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web_src/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web_src
        run: npm ci

      - name: Build Admin UI Into Backend Resources
        working-directory: web_src
        run: npm run build

      - name: Build Release JAR
        run: mvn -B -ntp package -DskipTests -DskipITs -Dlingsql.build.commit="${GITHUB_SHA}"

      - name: Prepare Artifact
        run: |
          mkdir -p dist
          ARTIFACT_FILE="$(ls -1 target/lingsql-engine-*.jar | grep -v '\.original$' | head -n 1)"
          test -n "${ARTIFACT_FILE}"
          cp "${ARTIFACT_FILE}" dist/lingsql-engine.jar

      - name: Generate And Verify SBOM
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_ARTIFACT_FILE: ./dist/lingsql-engine.jar
          SBOM_OUTPUT_DIR: ./dist
        run: ./scripts/ops/generate_release_sbom.sh

      - name: Upload Supply Chain Evidence
        uses: actions/upload-artifact@v7
        with:
          name: lingsql-supply-chain-evidence
          path: dist/

  database-migration:
    name: Database Migration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MYSQL_ROOT_PASSWORD: ci-root-password
      MYSQL_DATABASE: lingsql_engine_db
      MYSQL_APP_USERNAME: lingsql_app
      MYSQL_APP_PASSWORD: ci-app-password
      REDIS_PASSWORD: ci-redis-password
      LINGSQL_JWT_SECRET: ci-jwt-secret-at-least-32-characters
      LINGSQL_DATA_ENCRYPTION_KEY: ci-data-encryption-key-at-least-48-characters-long
      LINGSQL_ADMIN_PASSWORD: ci-admin-password
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start MySQL 8.4
        run: docker compose up -d --wait mysql

      - name: Verify Empty Database Migration Is Repeatable
        run: |
          bash scripts/ops/flyway_migrate.sh
          bash scripts/ops/flyway_migrate.sh
          test "$(docker compose exec -T mysql mysql -N -B -uroot -pci-root-password lingsql_engine_db -e \
            "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='lingsql_engine_db' AND TABLE_NAME LIKE 't_lingsql_engine\\_%';")" = "42"
          test "$(docker compose exec -T mysql mysql -N -B -uroot -pci-root-password lingsql_engine_db -e \
            "SELECT COUNT(*) FROM flyway_schema_history WHERE success = 0;")" = "0"

      - name: Verify Exact Legacy Database Adoption
        run: |
          docker compose exec -T mysql mysql -uroot -pci-root-password -e \
            "CREATE DATABASE lingsql_legacy_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;"
          docker compose exec -T mysql mysql -uroot -pci-root-password lingsql_legacy_ci \
            < src/main/resources/db/migration/B20260815_02__lingsql_control_schema.sql
          MYSQL_DATABASE=lingsql_legacy_ci bash scripts/ops/flyway_migrate.sh
          test "$(docker compose exec -T mysql mysql -N -B -uroot -pci-root-password lingsql_legacy_ci -e \
            "SELECT COUNT(*) FROM flyway_schema_history WHERE success = 1 AND version = '20260815.02';")" = "1"
          test "$(docker compose exec -T mysql mysql -N -B -uroot -pci-root-password lingsql_legacy_ci -e \
            "SELECT COUNT(*) FROM flyway_schema_history WHERE success = 1 AND version = '20260815.03';")" = "1"
          test "$(docker compose exec -T mysql mysql -N -B -uroot -pci-root-password lingsql_legacy_ci -e \
            "SELECT COUNT(*) FROM flyway_schema_history WHERE success = 1 AND version = '20260815.04';")" = "1"
          test "$(docker compose exec -T mysql mysql -N -B -uroot -pci-root-password lingsql_legacy_ci -e \
            "SELECT COUNT(*) FROM flyway_schema_history WHERE success = 1 AND version = '20260815.05';")" = "1"
          test "$(docker compose exec -T mysql mysql -N -B -uroot -pci-root-password lingsql_legacy_ci -e \
            "SELECT COUNT(*) FROM flyway_schema_history WHERE success = 1 AND version = '20260816.13';")" = "1"

      - name: Stop Migration Stack
        if: always()
        run: docker compose down --volumes --remove-orphans
