name: LingSQL Release Gate

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: "持有 UAT 门禁 Secrets 的受保护环境"
        required: true
        default: "uat"
        type: string
      base_url:
        description: "待发布环境基础地址（例如 https://api.lingsql.com）"
        required: true
        type: string
      prometheus_url:
        description: "Prometheus 地址（例如 http://prometheus:9090）"
        required: true
        type: string
      billing_readiness_url:
        description: "计费验收接口地址（留空则基于 base_url 自动拼接）"
        required: false
        default: ""
        type: string
      p1_drill_id:
        description: "本次引用的真实 P1 演练编号"
        required: true
        type: string
      p1_detected_at:
        description: "P1 演练发现时间（ISO-8601）"
        required: true
        type: string
      p1_acked_at:
        description: "P1 演练响应确认时间（ISO-8601）"
        required: true
        type: string
      p1_mitigated_at:
        description: "P1 演练缓解完成时间（ISO-8601）"
        required: true
        type: string

jobs:
  release-gate:
    name: Release Gate
    runs-on: self-hosted
    environment: ${{ inputs.environment_name }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Release Source
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "::error::正式发布门禁只能从远端 master 执行，当前引用为 ${GITHUB_REF}。"
            exit 1
          fi

      - name: Prepare Scripts
        run: chmod +x scripts/ops/*.sh

      - name: Validate Strict Gate Inputs
        env:
          BASE_URL: ${{ inputs.base_url }}
          PROMETHEUS_URL: ${{ inputs.prometheus_url }}
          BILLING_READINESS_URL: ${{ inputs.billing_readiness_url }}
          DRILL_ID: ${{ inputs.p1_drill_id }}
          DETECTED_AT: ${{ inputs.p1_detected_at }}
          ACKED_AT: ${{ inputs.p1_acked_at }}
          MITIGATED_AT: ${{ inputs.p1_mitigated_at }}
          BACKUP_RESTORE_MYSQL_HOST: ${{ vars.RELEASE_GATE_MYSQL_HOST }}
          BACKUP_RESTORE_MYSQL_PORT: ${{ vars.RELEASE_GATE_MYSQL_PORT }}
          BACKUP_RESTORE_SOURCE_DB: ${{ vars.RELEASE_GATE_BACKUP_SOURCE_DB }}
          BACKUP_RESTORE_BACKUP_DIR: ${{ vars.RELEASE_GATE_BACKUP_DIR }}
          BACKUP_RESTORE_BACKUP_USER: ${{ vars.RELEASE_GATE_BACKUP_USER }}
          BACKUP_RESTORE_RESTORE_USER: ${{ vars.RELEASE_GATE_RESTORE_USER }}
        run: |
          BASE_URL_TRIMMED="$(printf '%s' "${BASE_URL}" | xargs)"
          BILLING_URL_TRIMMED="$(printf '%s' "${BILLING_READINESS_URL}" | xargs)"
          if [ -z "${BILLING_URL_TRIMMED}" ] && [ -z "${BASE_URL_TRIMMED}" ]; then
            echo "::error::billing_readiness_url 与 base_url 不能同时为空。"
            exit 1
          fi
          for name in PROMETHEUS_URL DRILL_ID DETECTED_AT ACKED_AT MITIGATED_AT \
            BACKUP_RESTORE_MYSQL_HOST BACKUP_RESTORE_MYSQL_PORT BACKUP_RESTORE_SOURCE_DB \
            BACKUP_RESTORE_BACKUP_DIR BACKUP_RESTORE_BACKUP_USER BACKUP_RESTORE_RESTORE_USER; do
            if [ -z "$(printf '%s' "${!name}" | xargs)" ]; then
              echo "::error::严格发布门禁缺少 ${name}。"
              exit 1
            fi
          done

      - name: Validate Gate Credentials
        env:
          RELEASE_GATE_BILLING_TOKEN: ${{ secrets.RELEASE_GATE_BILLING_TOKEN }}
          RELEASE_GATE_CONTROL_TOKEN: ${{ secrets.RELEASE_GATE_CONTROL_TOKEN }}
          PILOT_TENANT_ID: ${{ secrets.RELEASE_GATE_PILOT_TENANT_ID }}
          PILOT_USERNAME: ${{ secrets.RELEASE_GATE_PILOT_USERNAME }}
          PILOT_PASSWORD: ${{ secrets.RELEASE_GATE_PILOT_PASSWORD }}
          BACKUP_RESTORE_BACKUP_PASSWORD: ${{ secrets.RELEASE_GATE_BACKUP_PASSWORD }}
          BACKUP_RESTORE_RESTORE_PASSWORD: ${{ secrets.RELEASE_GATE_RESTORE_PASSWORD }}
          BACKUP_RESTORE_SAMPLE_QUERY: ${{ secrets.RELEASE_GATE_BACKUP_SAMPLE_QUERY }}
        run: |
          for name in RELEASE_GATE_BILLING_TOKEN RELEASE_GATE_CONTROL_TOKEN PILOT_TENANT_ID PILOT_USERNAME PILOT_PASSWORD \
            BACKUP_RESTORE_BACKUP_PASSWORD BACKUP_RESTORE_RESTORE_PASSWORD BACKUP_RESTORE_SAMPLE_QUERY; do
            if [ -z "${!name}" ]; then
              echo "::error::严格发布门禁缺少 secret ${name}。"
              exit 1
            fi
          done

      - name: Run Release Gate
        env:
          BASE_URL: ${{ inputs.base_url }}
          PROMETHEUS_URL: ${{ inputs.prometheus_url }}
          RELEASE_GATE_ENABLE_SMOKE: "true"
          RELEASE_GATE_ENABLE_SLO: "true"
          RELEASE_GATE_ENABLE_COMMERCIAL: "true"
          RELEASE_GATE_BLOCK_ON_SLO_BREACH: "true"
          RELEASE_GATE_SLO_REPORT_FILE: ./reports/release_gate_slo.md
          RELEASE_GATE_COMMERCIAL_REPORT_FILE: ./reports/commercial_acceptance.md
          BILLING_READINESS_URL: ${{ inputs.billing_readiness_url }}
          BILLING_ALLOW_SKIP: "false"
          BILLING_AUTH_TOKEN: ${{ secrets.RELEASE_GATE_BILLING_TOKEN }}
          COMMERCIAL_REQUIRE_SLO: "true"
          COMMERCIAL_REQUIRE_PILOT: "true"
          PILOT_TENANT_ID: ${{ secrets.RELEASE_GATE_PILOT_TENANT_ID }}
          PILOT_USERNAME: ${{ secrets.RELEASE_GATE_PILOT_USERNAME }}
          PILOT_PASSWORD: ${{ secrets.RELEASE_GATE_PILOT_PASSWORD }}
          PILOT_CONTROL_TOKEN: ${{ secrets.RELEASE_GATE_CONTROL_TOKEN }}
          PILOT_REPORT_FILE: ./reports/pilot_acceptance.md
          BACKUP_RESTORE_MYSQL_HOST: ${{ vars.RELEASE_GATE_MYSQL_HOST }}
          BACKUP_RESTORE_MYSQL_PORT: ${{ vars.RELEASE_GATE_MYSQL_PORT }}
          BACKUP_RESTORE_SOURCE_DB: ${{ vars.RELEASE_GATE_BACKUP_SOURCE_DB }}
          BACKUP_RESTORE_TARGET_DB: lingsql_restore_verify_${{ github.run_id }}_${{ github.run_attempt }}
          BACKUP_RESTORE_BACKUP_USER: ${{ vars.RELEASE_GATE_BACKUP_USER }}
          BACKUP_RESTORE_BACKUP_PASSWORD: ${{ secrets.RELEASE_GATE_BACKUP_PASSWORD }}
          BACKUP_RESTORE_RESTORE_USER: ${{ vars.RELEASE_GATE_RESTORE_USER }}
          BACKUP_RESTORE_RESTORE_PASSWORD: ${{ secrets.RELEASE_GATE_RESTORE_PASSWORD }}
          BACKUP_RESTORE_BACKUP_DIR: ${{ vars.RELEASE_GATE_BACKUP_DIR }}
          BACKUP_RESTORE_WORK_ROOT: ${{ runner.temp }}/lingsql-backup-restore
          BACKUP_RESTORE_SAMPLE_QUERY: ${{ secrets.RELEASE_GATE_BACKUP_SAMPLE_QUERY }}
          BACKUP_RESTORE_REPORT_FILE: ./reports/backup_restore_acceptance.md
          DRILL_ID: ${{ inputs.p1_drill_id }}
          DETECTED_AT: ${{ inputs.p1_detected_at }}
          ACKED_AT: ${{ inputs.p1_acked_at }}
          MITIGATED_AT: ${{ inputs.p1_mitigated_at }}
          SLO_WINDOW: "30d"
          SLO_TARGET: "99.9"
          SLO_MIN_REQUESTS: "100"
        run: ./scripts/ops/release_gate.sh

      - name: Upload SLO Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-slo-report
          path: reports/release_gate_slo.md
          if-no-files-found: ignore

      - name: Upload Commercial Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-commercial-reports
          path: reports/
          if-no-files-found: ignore
