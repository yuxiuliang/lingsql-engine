name: LingSQL Dependabot Auto Merge

on:
  workflow_run:
    workflows:
      - LingSQL CI
      - LingSQL Security
      - LingSQL CodeQL
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: lingsql-dependabot-automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  merge-when-green:
    name: Merge Dependabot PR When Gates Are Green
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'dependabot/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Dependabot PR Number
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          PR_NUMBER="$(gh pr list --state open --head "${HEAD_BRANCH}" --json number,author,isDraft,baseRefName --jq 'map(select(.author.login=="dependabot[bot]" and .baseRefName=="master" and (.isDraft|not)))[0].number // empty')"
          if [ -z "${PR_NUMBER}" ]; then
            echo "pr_number=" >> "${GITHUB_OUTPUT}"
            echo "未找到可合并的 Dependabot PR，跳过。"
            exit 0
          fi
          echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Verify All Required Checks
        id: verify
        if: ${{ steps.resolve.outputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        run: |
          CHECKS_JSON="$(gh pr checks "${PR_NUMBER}" --json name,state 2>/dev/null || true)"
          REQUIRED_CHECKS=(
            "Backend Test"
            "Frontend Build"
            "Dependency Review"
            "Trivy Library Scan"
            "Analyze (java)"
            "Analyze (javascript-typescript)"
          )
          READY=true
          for CHECK_NAME in "${REQUIRED_CHECKS[@]}"; do
            CHECK_STATE="$(jq -r --arg name "${CHECK_NAME}" '[.[] | select(.name == $name)][0].state // "MISSING"' <<< "${CHECKS_JSON}")"
            echo "${CHECK_NAME}: ${CHECK_STATE}"
            if [ "${CHECK_STATE}" != "SUCCESS" ]; then
              READY=false
            fi
          done
          echo "merge_ready=${READY}" >> "${GITHUB_OUTPUT}"

      - name: Merge PR
        if: ${{ steps.verify.outputs.merge_ready == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        run: gh pr merge "${PR_NUMBER}" --squash --delete-branch
